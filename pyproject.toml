[build-system]
requires = ["setuptools>=70", "wheel", "build"]
build-backend = "setuptools.build_meta"


[project]
name = "netra-recon"
version = "2.0"
description = "Toolkit for information gathering & reconnaissance."
readme = "README.md"
license = "MIT"
authors = [{ name = "Jenish(404_Not_Found)" }]
requires-python = ">=3.10"
keywords = ["recon", "security", "osint", "networking", "dns", "http", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Topic :: Security",
  "Intended Audience :: Information Technology",
  "Typing :: Typed"
]

dependencies = [
  "aiohttp>=3.8,<4",
  "aioquic>=0.9,<2",
  "cmd2>=2.4,<5",
  "requests>=2.32,<3",
  "urllib3>=2,<3",
  "rich>=13,<14",
  "colorama>=0.4.5,<1",
  "tabulate>=0.8.10,<1",
  "dnspython>=2.6,<3",
  "pysnmp>=4.4.12,<8",
  "paramiko>=3,<6",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5,<6",
  "pyOpenSSL>=22,<27",
  "PyJWT>=2.6,<3",
  "cryptography>=37",
  "Jinja2>=3.1,<4",
  "packaging>=24,<25",
  "python-slugify>=8,<9",
  "mmh3>=4,<5",
  "idna>=3,<4",
  "jarm>=0.1",
  "ldap3>=2.9,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=4",
  "ruff>=0.6",
  "mypy>=1.11",
  "build>=1.2",
  "twine>=5",
  "bandit>=1.7",
  "pip-audit>=2.9",
]

[project.scripts]
"netra-recon" = "netra_recon.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["netra_recon", "netra_recon.*"]

[tool.setuptools.package-data]
netra_recon = [
  "config/*.json",
  "templates/**/*.j2",
  "data/**/*",
  "py.typed",
]
